[project]
name = "autodoc"
version = "0.8.1"
description = "Automated documentation generator for code repositories."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi==0.135.3",
    "jinja2==3.1.6",
    "openai==1.99.9",
    "pandas==2.3.1",
    "pydantic==2.11.7",
    "python-dotenv==1.2.2",
    "python-gitlab==6.2.0",
    "python-multipart==0.0.32",
    "requests==2.33.0",
    "sqlalchemy==2.0.51",
    "tqdm==4.67.1",
    "urllib3==2.7.0",
    "uvicorn==0.35.0",
]

[dependency-groups]
docs = [
    "astroid<4",
    "renku-sphinx-theme",
    "sphinx==8.2.3",
    "sphinx-autoapi==3.6.0",
    "sphinx-rtd-theme==3.0.2",
]
dev = [
    { include-group = "docs" },
    "httpx==0.28.1",
    "pytest==9.0.3",
    "pytest-cov==6.2.1",
    "pyyaml==6.0.3",
    "ruff==0.12.7",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["autoapi_include"]

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S108", "S603", "S607"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # multiprocessing.Process(...).start() forks a process that also runs
    # background dispatcher threads (see admin/jobs.py). CPython warns on this
    # unconditionally, but the forked target (_execute_run_process) is a
    # self-contained top-level function that opens its own fresh DB session
    # rather than relying on inherited thread/lock state, so this is safe here.
    # Switching to the "spawn" start method would avoid the warning, but spawn
    # re-imports modules fresh in the child, which breaks the test suite's
    # strategy of monkeypatching job-execution functions for fault injection.
    "ignore:This process .* is multi-threaded, use of fork\\(\\) may lead to deadlocks in the child.:DeprecationWarning",
]

[tool.pyright]
extraPaths = ["src"]
